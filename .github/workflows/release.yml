# whatiiif: template only. Copies call publish.yml and offer-update.yml at the tag of their major version (v1 for
# 1.x). A release made by hand moves that tag to it, by the rule a release made on merging does (.github/release.sh
# point): not for a pre-release, and never back from a later release. A release made on merging, by Live's release
# job, starts no workflow, and moves the tag itself.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move-tag:
    # A pre-release is for trying out: copies keep running the last full release.
    if: github.event.repository.is_template && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Point the tag of its major version (v1 for 1.x) at this release, unless it is on a later one
        run: bash .github/release.sh point "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
